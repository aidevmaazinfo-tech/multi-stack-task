<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Desktop EEL</title>
    <style>
        /* RESET */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; /* Important for small screens */
        }

        .login-container {
            background: rgba(255,255,255,0.95);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            animation: slideUp 0.7s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-container h2 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 8px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            background: #f7fafc;
            color: #2d3748;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 600;
        }

        .alert-success { background: #c6f6d5; color: #22543d; }
        .alert-error { background: #fed7d7; color: #742a2a; }

        .badge {
            position: fixed;
            top: 12px;
            right: 16px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(5px);
        }

        .hint {
            text-align: center;
            color: #718096;
            font-size: 12px;
            margin-top: 20px;
        }

        /* 🔥 RESPONSIVE MEDIA QUERIES 🔥 */

        /* Small Mobile (Width < 400px) */
        @media (max-width: 400px) {
            body { padding: 10px; }
            .login-container {
                padding: 25px 20px;
                border-radius: 15px;
            }
            .login-container h2 { font-size: 22px; }
            .subtitle { font-size: 13px; margin-bottom: 20px; }
            .input-group input { padding: 12px 14px; font-size: 14px; }
            .login-btn { padding: 14px; font-size: 14px; }
            .badge { font-size: 10px; padding: 4px 10px; top: 8px; right: 10px; }
        }

        /* Tablet (Width 400px - 768px) */
        @media (min-width: 401px) and (max-width: 768px) {
            .login-container { padding: 35px 30px; }
        }

        /* Large Screens (Width > 1200px) - Optional Zoom */
        @media (min-width: 1200px) {
            .login-container { max-width: 480px; padding: 50px 45px; }
            .login-container h2 { font-size: 28px; }
            .input-group input { padding: 16px 18px; font-size: 16px; }
            .login-btn { padding: 18px; font-size: 17px; }
        }
    </style>
</head>
<body>
    <div class="badge">🖥️ Desktop Mode - EEL</div>
    <div class="login-container">
        <h2>🔐 Welcome Back</h2>
        <p class="subtitle">Sign in - Desktop (EEL)</p>
        <div id="alertBox" class="alert"></div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn" id="loginBtn">Sign In →</button>
        </form>
        <p class="hint">💡 Demo: admin / 1234 or user / pass</p>
    </div>
    <script src="/eel.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const btn = document.getElementById('loginBtn');

            if (!u || !p) { showAlert('Fill all fields!', 'error'); return false; }

            btn.disabled = true;
            btn.textContent = 'Checking...';
            try {
                const result = await eel.login_via_php(u, p)();
                showAlert((result.success ? '✅ ' : '❌ ') + result.message, result.success ? 'success' : 'error');
            } catch (err) {
                showAlert('❌ Could not reach backend!', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Sign In →';
            }
            return false;
        }
        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.textContent = msg;
            box.className = 'alert alert-' + type;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
