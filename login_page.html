<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background: rgba(255,255,255,0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            width: 100%; max-width: 420px;
            animation: slideUp 0.7s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-container h2 {
            text-align: center; color: #2d3748;
            margin-bottom: 8px; font-size: 26px;
        }
        .subtitle {
            text-align: center; color: #718096;
            font-size: 14px; margin-bottom: 30px;
        }
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label {
            display: block; margin-bottom: 8px;
            color: #4a5568; font-weight: 600;
            font-size: 13px; text-transform: uppercase;
        }
        .input-group input {
            width: 100%; padding: 14px 16px 14px 45px;
            border: 2px solid #e2e8f0; border-radius: 12px;
            font-size: 15px; background: #f7fafc; color: #2d3748;
        }
        .input-group input:focus {
            outline: none; border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
        }
        .input-icon {
            position: absolute; left: 16px;
            top: 50%; transform: translateY(-50%);
            font-size: 18px; color: #a0aec0; margin-top: 12px;
        }
        .login-btn {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 12px;
            font-size: 16px; font-weight: 700; cursor: pointer;
        }
        .login-btn:hover { transform: translateY(-2px); }
        .alert {
            padding: 14px; border-radius: 10px;
            margin-bottom: 20px; display: none;
            text-align: center; font-weight: 600;
        }
        .alert-success { background: #c6f6d5; color: #22543d; }
        .alert-error { background: #fed7d7; color: #742a2a; }
        .hint-box {
            margin-top: 20px; padding: 15px;
            background: #edf2f7; border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .hint-box p { color: #4a5568; font-size: 12px; }
        .hint-box code {
            background: #e2e8f0; padding: 2px 8px;
            border-radius: 4px; color: #764ba2; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🔐 Welcome Back</h2>
        <p class="subtitle">Sign in to your account</p>
        <div id="alertBox" class="alert"></div>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="input-group">
                <label>Username</label>
                <span class="input-icon">👤</span>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <span class="input-icon">🔒</span>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn">Sign In →</button>
        </form>
        <div class="hint-box">
            <p>💡 <strong>Demo:</strong> <code>admin</code> / <code>1234</code> or <code>user</code> / <code>pass</code></p>
        </div>
    </div>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            const box = document.getElementById('alertBox');
            if (!u || !p) { showAlert('Fill all fields!', 'error'); return false; }
            if ((u === 'admin' && p === '1234') || (u === 'user' && p === 'pass')) {
                showAlert('✅ Welcome, ' + u + '!', 'success');
            } else {
                showAlert('❌ Invalid credentials!', 'error');
            }
            return false;
        }
        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            box.textContent = msg; box.className = 'alert alert-' + type;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
